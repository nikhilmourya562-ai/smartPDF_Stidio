function ranges(s,n){const out=[];for(const part of s.split(',').map(x=>x.trim()).filter(Boolean)){const m=part.match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)throw Error('Invalid range "'+part+'". Use e.g. 1-3,5');const a=+m[1],b=+(m[2]||m[1]);if(a<1||b<a||b>n)throw Error(`Range "${part}" is outside 1–${n}`);out.push(Array.from({length:b-a+1},(_,i)=>a-1+i))}if(!out.length)throw Error('Enter at least one page range');return out}

async function imgToPdf(items,o,prog){ // items: {blob,type}

{id:'merge',n:'Merge PDF',d:'Combine several PDFs into one',i:'🧩',c:'Organize',k:'pdf',multi:1,async run(fs,pr){const o=await PL.PDFDocument.create();let i=0;for(const f of fs){chk();const s=await load(f);(await o.copyPages(s,s.getPageIndices())).forEach(p=>o.addPage(p));pr(++i/fs.length,f.name)}return[{name:'merged.pdf',blob:await pdfb(o)}]}},
{id:'split',n:'Split PDF',d:'One PDF per page range',i:'✂️',c:'Organize',k:'pdf',o:()=>'<label class=f>Ranges, comma-separated (each becomes its own PDF)<input type=text id=r1 value="1-2,3"></label>',async run(fs){const s=await load(fs[0]),n=s.getPageCount(),r=ranges($('#r1').value,n),out=[];for(const x of r){chk();out.push({name:`split-${x[0]+1}-${x[x.length-1]+1}.pdf`,blob:await pdfb(await build(s,x))})}return out}},

{id:'compress',n:'Compress PDF',d:'Shrink file size while keeping text sharp',i:'🗜️',c:'Optimize',k:'pdf',o:()=>'<label class=f>Level<select id=r1><option value="2400,.85">Light (best image quality)</option><option value="1600,.72" selected>Balanced (recommended)</option><option value="1100,.55">Strong (smallest, images look softer)</option><option value=raster>Smallest: flatten pages to images (text becomes blurry; only for scans)</option></select></label><p class=mut>The first three levels keep text and vector graphics exactly as they are. They re-compress embedded photos and scans, remove unused data and pack the file efficiently. Results depend on the PDF: text-only files may not shrink.</p>',async run(fs,pr){const a=fs[0].size,v=$('#r1').value;let b,note;

{id:'img2pdf',n:'JPG / PNG / WEBP → PDF',d:'Images into one PDF',i:'🖼️',c:'Convert to PDF',k:'img',multi:1,o:()=>'<label class=f>Page size<select id=r1><option value=fit>Fit to image</option><option>A4</option><option>A3</option><option>Letter</option><option>Legal</option></select></label><label class=f>Orientation<select id=r2><option value=auto>Auto</option><option value=port>Portrait</option><option value=land>Landscape</option></select></label><label class=f>Margin (mm)<input type=number id=r3 value=10 min=0 max=50></label>',async run(fs,pr){const its=[];for(const f of fs)its.push({blob:f,type:await sniff(f)});return[{name:'images.pdf',blob:await imgToPdf(its,{size:$('#r1').value,orient:$('#r2').value,m:+$('#r3').value},pr)}]}},
{id:'pdf2img',n:'PDF → JPG / PNG',d:'Export every page as an image',i:'🏞️',c:'Convert from PDF',k:'pdf',o:()=>'<label class=f>Format<select id=r1><option value=jpg>JPG</option><option value=png>PNG</option></select></label><label class=f>Resolution<select id=r2><option value=1.5>Standard</option><option value=2.5>High</option><option value=1>Small</option></select></label>',async run(fs,pr){const pd=await pdfjs(fs[0]),jp=$('#r1').value==='jpg',out=[];for(let i=1;i<=pd.numPages;i++){chk();const c=await pagec(pd,i,+$('#r2').value);out.push({name:`page-${i}.${jp?'jpg':'png'}`,blob:await blobc(c,jp?'image/jpeg':'image/png',.92)});pr(i/pd.numPages,`Page ${i}/${pd.numPages}`)}return out}},
{id:'pdf2txt',n:'PDF → Text',d:'Extract selectable text',i:'🔤',c:'Convert from PDF',k:'pdf',async run(fs,pr){const pd=await pdfjs(fs[0]);let t='';for(let i=1;i<=pd.numPages;i++){chk();const tc=await(await pd.getPage(i)).getTextContent();t+=`--- Page ${i} ---\n`+tc.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n\n';pr(i/pd.numPages)}if(t.replace(/--- Page \d+ ---|\s/g,'').length<10)throw Error('No selectable text found. This looks like a scanned PDF: run it through the OCR tool first.');return[{name:'text.txt',blob:new Blob([t],{type:'text/plain'})}]}},
{id:'wm',n:'Watermark & Page Numbers',d:'Stamp text and number pages',i:'💧',c:'Edit',k:'pdf',o:()=>'<label class=f>Watermark text (Latin characters; leave empty for none)<input type=text id=r1 value="CONFIDENTIAL"></label><label class=f>Opacity %<input type=number id=r2 value=20 min=5 max=100></label><label class=f><input type=checkbox id=r3 checked> Add page numbers</label>',async run(fs){const d=await load(fs[0]),f=await d.embedFont(PL.StandardFonts.Helvetica),t=$('#r1').value.trim(),op=$('#r2').value/100,pn=$('#r3').checked;if(!t&&!pn)throw Error('Nothing to add');const ps=d.getPages();ps.forEach((p,i)=>{const{width:w,height:h}=p.getSize();if(t){const sz=Math.min(w,h)/(t.length>8?9:6),tw=f.widthOfTextAtSize(t,sz),a=Math.PI/4;p.drawText(t,{x:w/2-Math.cos(a)*tw/2+Math.sin(a)*sz/3,y:h/2-Math.sin(a)*tw/2-Math.cos(a)*sz/3,size:sz,font:f,rotate:PL.degrees(45),color:PL.rgb(.5,.5,.5),opacity:op})}if(pn){const s=`${i+1} / ${ps.length}`;p.drawText(s,{x:w/2-f.widthOfTextAtSize(s,10)/2,y:20,size:10,font:f,color:PL.rgb(.2,.2,.2)})}});return[{name:'stamped.pdf',blob:await pdfb(d)}]}},
{id:'meta',n:'Inspect / Edit Metadata',d:'View info and save a copy with new title/author',i:'ℹ️',c:'Utilities',k:'pdf',o:()=>'<label class=f>New title (blank = keep)<input type=text id=r1></label><label class=f>New author (blank = keep)<input type=text id=r2></label>',async run(fs){const d=await load(fs[0]),n=`Pages: ${d.getPageCount()} · Size: ${fmt(fs[0].size)} · Title: ${d.getTitle()||'—'} · Author: ${d.getAuthor()||'—'} · Producer: ${d.getProducer()||'—'} · Created: ${d.getCreationDate()?.toLocaleString()||'—'}`;if($('#r1').value)d.setTitle($('#r1').value);if($('#r2').value)d.setAuthor($('#r2').value);return[{name:'metadata-copy.pdf',blob:await pdfb(d),note:n}]}},
{id:'unlock',n:'Unlock PDF',d:'Open a PDF with its password and save an unprotected copy',i:'🔓',c:'Security',k:'pdf',o:()=>'<label class=f>Password (only for files you are authorized to open)<input type=password id=r1 autocomplete=off></label><p class=mut>The copy is rebuilt from page images, so text will not be selectable.</p>',async run(fs,pr){const pd=await pdfjs(fs[0],$('#r1').value);return[{name:'unlocked.pdf',blob:await pdfb(await raster(pd,2,.9,pr)),note:'Unprotected copy (pages re-rendered as images)'}]}},
{id:'redact',n:'Redact PDF',d:'Draw boxes to permanently remove content',i:'⬛',c:'Security',k:'pdf',ui:1,go:'Apply redaction & save',o:()=>'<p class=mut>Drag on the page to draw boxes. On export every page is flattened to an image, so covered text and images are truly removed, not just hidden. All pages become non-searchable images.</p>',async run(fs,pr){const w=W.redact;if(!w.it.length)throw Error('Draw at least one redaction box first');const pd=w.pd,o=await PL.PDFDocument.create();for(let i=1;i<=pd.numPages;i++){chk();const c=await pagec(pd,i,2),x=c.getContext('2d');x.fillStyle='#000';w.it.filter(r=>r.p===i).forEach(r=>x.fillRect(r.x*c.width,r.y*c.height,r.w*c.width,r.h*c.height));const v=(await pd.getPage(i)).getViewport({scale:1}),im=await o.embedJpg(await(await blobc(c,'image/jpeg',.9)).arrayBuffer());o.addPage([v.width,v.height]).drawImage(im,{x:0,y:0,width:v.width,height:v.height});pr(i/pd.numPages,`Page ${i}/${pd.numPages}`)}const b=await pdfb(o),vd=await PJ.getDocument({data:new Uint8Array(await b.arrayBuffer())}).promise;let tx=0;for(let i=1;i<=vd.numPages;i++)tx+=(await(await vd.getPage(i)).getTextContent()).items.length;return[{name:'redacted.pdf',blob:b,note:tx===0?'Verified: output has no text layer (0 text items); every page is a flattened image, so redacted content cannot be recovered.':'WARNING: output still contains '+tx+' text items.'}]}},
{id:'ocr',n:'OCR: Scanned PDF to Searchable PDF',d:'Recognize text in scanned PDFs and photos; get a searchable PDF, text, Word or Excel',i:'🔎',c:'OCR & Text Recognition',k:'ocr',multi:1,go:'Run OCR',o:()=>'<label class=f>Language(s) in the document (choose up to 3)</label><select id=ol multiple size=7 style="max-width:440px;width:100%;font:inherit;padding:6px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)">'+OL.map(l=>`<option value="${l[0]}"${l[0]==='eng'?' selected':''}>${esc(l[1])}</option>`).join('')+'</select><label class=f>Quality<select id=od><option value=150>Fast (150 dpi)</option><option value=200 selected>Standard (200 dpi)</option><option value=300>Best (300 dpi, slower, uses more memory)</option></select></label><label class=f>Create</label><label class=f><input type=checkbox id=oo1 checked> Searchable PDF</label><label class=f><input type=checkbox id=oo2 checked> Plain text (.txt)</label><label class=f><input type=checkbox id=oo3> Word (.docx)</label><label class=f><input type=checkbox id=oo4> Excel (.xlsx, best-effort tables)</label><label class=f><input type=checkbox id=oc checked> Combine all files into one result</label><p class=mut>OCR downloads its engine and the language data from the internet the first time you use it (a few MB per language); your files themselves are processed on this device and are not uploaded. Large documents take a while: press Stop to keep what is finished. Accuracy depends on scan quality; check important text in the review box that appears after processing.</p>',
async run(fs,pr){if(!window.Tesseract){pr(0,'Loading OCR library…');await loadJS(['https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js','https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'])}const langs=[...$('#ol').selectedOptions].map(o=>o.value).slice(0,3);if(!langs.length)langs.push('eng');const dpi=+$('#od').value,want={pdf:$('#oo1').checked,txt:$('#oo2').checked,doc:$('#oo3').checked,xls:$('#oo4').checked,comb:$('#oc').checked};if(!want.pdf&&!want.txt&&!want.doc&&!want.xls)throw Error('Choose at least one output');if(want.xls)need(window.XLSX,'Excel');
 const srcs=[];for(const f of fs){const ty=await sniff(f);if(ty==='pdf'){const pd=await pdfjs(f);srcs.push({f,pd,n:pd.numPages})}else srcs.push({f,n:1})}const total=srcs.reduce((a,s)=>a+s.n,0);let cp=0,cur=0;
 const PATHS=['https://tessdata.projectnaptha.com/4.0.0','https://raw.githubusercontent.com/naptha/tessdata/gh-pages/4.0.0'],mk=lp=>Tesseract.createWorker(langs,1,{langPath:lp,logger:m=>{if(m&&m.status==='recognizing text')pr((cur-1+(m.progress||0))/total*.95,`OCR page ${cur}/${total} · ${Math.round((m.progress||0)*100)}%`)}});
 pr(0,'Loading OCR engine and language data…');let wk;try{wk=await mk(PATHS[0])}catch(e){try{wk=await mk(PATHS[1])}catch(e2){throw Error('OCR could not download its engine or language data. Check your internet connection and try again. (This can also happen inside preview windows that block downloads; it works on the hosted website.)')}}
 try{await wk.setParameters({user_defined_dpi:String(dpi)})}catch(e){}
 const res=[];let stopped=false,conf=0,cn=0;
 try{for(const s of srcs){const pgs=[];for(let i=1;i<=s.n;i++){if(cancel){stopped=true;break}cur=++cp;let cv,W,H;
   if(s.pd){const pg=await s.pd.getPage(i),v=pg.getViewport({scale:1});W=v.width;H=v.height;cv=await pagec(s.pd,i,Math.min(dpi/72,Math.sqrt(16e6/(W*H))))}
   else{const bm=await createImageBitmap(s.f),k=Math.min(1,5000/Math.max(bm.width,bm.height));cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(bm,0,0,cv.width,cv.height);const q=Math.min(1,842/Math.max(cv.width,cv.height));W=cv.width*q;H=cv.height*q}
   const r=await wk.recognize(await blobc(cv,'image/jpeg',.85),{},{text:true,blocks:true,pdf:true}),d=r.data;pgs.push({W,H,text:d.text||'',rows:want.xls?ocrRows(d):null,pdf:want.pdf&&d.pdf?Uint8Array.from(d.pdf):null});if(typeof d.confidence==='number'){conf+=d.confidence;cn++}
   pr(cur/total*.95,`OCR page ${cur}/${total}`);await new Promise(r=>setTimeout(r))}
  res.push({s,pgs});if(stopped)break}}finally{try{await wk.terminate()}catch(e){}}
 const had=cancel;cancel=false;const done=res.reduce((a,r)=>a+r.pgs.length,0);if(!done)throw Error(had?'Cancelled before any page was finished.':'No text could be recognized.');
 pr(.96,'Building results…');const groups=want.comb?[{name:res[0].s.f.name,pgs:res.flatMap(r=>r.pgs)}]:res.map(r=>({name:r.s.f.name,pgs:r.pgs}));const out=[];let allText='';
 for(const g of groups){const base=g.name.replace(/\.[^.]+$/,'')+(want.comb&&res.length>1?'-and-more':''),txt=g.pgs.map((p,i)=>`--- Page ${i+1} ---\n`+p.text.trim()).join('\n\n');allText+=(allText?'\n\n':'')+(groups.length>1?`===== ${g.name} =====\n`:'')+txt;
  if(want.pdf){const fin=await PL.PDFDocument.create();for(const p of g.pgs){if(!p.pdf)continue;const[ep]=await fin.embedPdf(p.pdf);fin.addPage([p.W,p.H]).drawPage(ep,{x:0,y:0,width:p.W,height:p.H})}out.push({name:base+'-searchable.pdf',blob:await pdfb(fin)})}
  if(want.txt)out.push({name:base+'.txt',blob:new Blob([txt],{type:'text/plain;charset=utf-8'})});
  if(want.doc)out.push({name:base+'.docx',blob:await docxBlob(ocrParas(txt))});
  if(want.xls){const wb=XLSX.utils.book_new();g.pgs.forEach((p,i)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(p.rows&&p.rows.length?p.rows:[['']]),'Page '+(i+1)));out.push({name:base+'.xlsx',blob:new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/octet-stream'})})}}
 const note=`${done} of ${total} page(s) recognized (${langs.join('+')})${cn?`, average confidence ${Math.round(conf/cn)}%`:''}${done<total?'. Stopped early: run again on the remaining pages':''}.`;out.forEach(o=>o.note=note);out.after=()=>mountOcr(allText);return out}},
{id:'edit',n:'Edit PDF',d:'Full-screen editor: edit text, add text, images, signatures, highlights, shapes, notes and more',i:'✏️',c:'Edit',k:'pdf',ui:1,go:'Save edited PDF',o:()=>'<label class=f><input type=checkbox id=ef> Flatten result to images (permanently removes replaced or erased content; text becomes non-selectable)</label><p class=mut>Use “Full screen” above the page for a bigger workspace. Edited text is re-typed in the chosen standard font over a white box, so it may not match the original. Without “Flatten”, the original content still exists under edits.</p>',async run(fs,pr){const w=W.edit;if(!w.it.length)throw Error('Make at least one edit first');const d=await load(fs[0]),pg=d.getPages(),FC={},fnt=async n=>FC[n]||(FC[n]=await d.embedFont(PL.StandardFonts[n]||PL.StandardFonts.Helvetica)),wh=PL.rgb(1,1,1),hc=h=>{h=h||'#000000';return PL.rgb(parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255)};
 for(const r of w.it){const p=pg[r.p-1],{width:pw,height:ph}=p.getSize(),X=v=>v*pw,Y=v=>ph-v*ph,col=hc(r.col),sw=r.sw||2,th={thickness:sw,color:col,lineCap:PL.LineCapStyle.Round},fl=r.fl?{color:col,opacity:.3,borderOpacity:1}:{};
  if(r.k==='ed'){p.drawRectangle({x:r.x0-1,y:r.base-.25*r.fs,width:r.x1-r.x0+2,height:1.1*r.fs,color:wh});p.drawText(r.t,{x:r.x0,y:r.base,size:r.fs,font:await fnt(r.fn),color:col})}
  else if(r.k==='er')p.drawRectangle({x:X(r.x),y:Y(r.y+r.h),width:X(r.w),height:r.h*ph,color:wh});
  else if(r.k==='tx'||r.k==='dt')p.drawText(r.t,{x:X(r.x),y:Y(r.y)-r.z,size:r.z,font:await fnt(r.fn),color:col});
  else if(r.k==='nt'){const L=nwrap(r.t),f=await fnt('Helvetica'),hb=L.length*12+8;p.drawRectangle({x:X(r.x),y:Y(r.y)-hb,width:150,height:hb,color:PL.rgb(1,.95,.63),borderColor:PL.rgb(.79,.66,0),borderWidth:1});L.forEach((l,i)=>p.drawText(l,{x:X(r.x)+4,y:Y(r.y)-14-i*12,size:10,font:f,color:PL.rgb(0,0,0)}))}
  else if(r.k==='hl')p.drawRectangle({x:X(r.x),y:Y(r.y+r.h),width:X(r.w),height:r.h*ph,color:col,opacity:.4});
  else if(r.k==='ul'||r.k==='st'){const yy=Y(r.k==='ul'?r.y+r.h:r.y+r.h/2);p.drawLine({start:{x:X(r.x),y:yy},end:{x:X(r.x+r.w),y:yy},...th})}
  else if(r.k==='rc')p.drawRectangle({x:X(r.x),y:Y(r.y+r.h),width:X(r.w),height:r.h*ph,borderColor:col,borderWidth:sw,...fl});
  else if(r.k==='el')p.drawEllipse({x:X(r.x+r.w/2),y:Y(r.y+r.h/2),xScale:X(r.w)/2,yScale:r.h*ph/2,borderColor:col,borderWidth:sw,...fl});
  else if(r.k==='ln'||r.k==='ar'){const a={x:X(r.x1),y:Y(r.y1)},b={x:X(r.x2),y:Y(r.y2)};p.drawLine({start:a,end:b,...th});if(r.k==='ar'){const an=Math.atan2(b.y-a.y,b.x-a.x),hl=8+3*sw;for(const s of[-1,1])p.drawLine({start:b,end:{x:b.x-hl*Math.cos(an+s*.45),y:b.y-hl*Math.sin(an+s*.45)},...th})}}
  else if(r.k==='pn')for(let i=1;i<r.pts.length;i++)p.drawLine({start:{x:X(r.pts[i-1][0]),y:Y(r.pts[i-1][1])},end:{x:X(r.pts[i][0]),y:Y(r.pts[i][1])},...th});
  else if(r.k==='im'){const im=r.ty==='jpg'?await d.embedJpg(r.bytes):await d.embedPng(r.bytes),wd=r.wf*pw,ht=wd*r.ar;p.drawImage(im,{x:r.x*pw-wd/2,y:ph-r.y*ph-ht/2,width:wd,height:ht})}}
 let blob=await pdfb(d),note='Edited copy. Original content under edited or erased areas still exists in the file; tick “Flatten” to remove it permanently.';if($('#ef').checked){blob=await pdfb(await raster(await PJ.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise,2,.9,pr));note='Flattened copy: replaced and erased content is permanently removed; text is no longer selectable.'}return[{name:'edited.pdf',blob,note}]}},
{id:'protect',n:'Protect PDF',d:'Encrypt a PDF with a password (AES-128) and set permissions',i:'🔒',c:'Security',k:'pdf',o:()=>'<label class=f>Password to open the file<input type=password id=r1 autocomplete=new-password></label><label class=f>Owner password for permissions (blank = same as above)<input type=password id=r2 autocomplete=new-password></label><label class=f><input type=checkbox id=p1 checked> Allow printing</label><label class=f><input type=checkbox id=p2 checked> Allow copying text</label><label class=f><input type=checkbox id=p3 checked> Allow editing &amp; annotating</label><p class=mut>⚠ If you forget the password the file cannot be recovered. Permission limits are advisory: some PDF apps ignore them.</p>',async run(fs){if(!(window.crypto&&crypto.subtle))throw Error('Password protection needs a secure (https) page and a current browser.');const pw=$('#r1').value;if(!pw)throw Error('Enter a password');const fl=($('#p1').checked?0x804:0)|($('#p2').checked?0x210:0)|($('#p3').checked?0x528:0),d=await PL.PDFDocument.load(await fs[0].arrayBuffer(),{updateMetadata:false});return[{name:'protected.pdf',blob:new Blob([await protectDoc(d,pw,$('#r2').value,fl)],{type:'application/pdf'}),note:'AES-128 encrypted. Opening it requires the password.'}]}},
{id:'repair',n:'Repair PDF',d:'Recover readable content from damaged PDFs',i:'🩹',c:'Utilities',k:'pdf',async run(fs,pr){const buf=await fs[0].arrayBuffer();try{const d=await PL.PDFDocument.load(buf,{throwOnInvalidObject:false,updateMetadata:false});if(!d.getPageCount())throw Error('no pages');const b=await pdfb(d);await(await PJ.getDocument({data:new Uint8Array(await b.arrayBuffer())}).promise).getPage(1);return[{name:'repaired.pdf',blob:b,note:'Structure rebuilt; text and graphics preserved'}]}catch(e){}try{const pd=await PJ.getDocument({data:new Uint8Array(buf)}).promise;return[{name:'recovered.pdf',blob:await pdfb(await raster(pd,2,.9,pr)),note:'Standard repair failed; readable pages were recovered as images (text not selectable)'}]}catch(e){throw Error('This file could not be recovered: '+errm(e))}}},
{id:'formfill',n:'Fill & Flatten Form',d:'Fill PDF form fields, optionally flatten them',i:'📋',c:'Edit',k:'pdf',ff:1,go:'Save filled PDF',o:()=>'<label class=f><input type=checkbox id=r1> Flatten after filling (fields become fixed, non-editable content)</label>',async run(fs){if(!document.querySelector('[data-ff]')&&!$('#r1').checked)throw Error('No fillable fields found');const d=await load(fs[0]),form=d.getForm();document.querySelectorAll('[data-ff]').forEach(el=>{const nm=el.dataset.n,tp=el.dataset.tp;if(tp==='t')form.getTextField(nm).setText(el.value);else if(tp==='c'){const c=form.getCheckBox(nm);el.checked?c.check():c.uncheck()}else if(el.value){if(tp==='d')form.getDropdown(nm).select(el.value);else if(tp==='r')form.getRadioGroup(nm).select(el.value);else form.getOptionList(nm).select(el.value)}});if($('#r1').checked)form.flatten();return[{name:'filled.pdf',blob:await pdfb(d),note:$('#r1').checked?'Form flattened':'Form fields remain editable'}]}},
{id:'formmake',n:'Create Form Fields',d:'Drag on a page to add text boxes, checkboxes and dropdowns',i:'🧾',c:'Edit',k:'pdf',ui:1,go:'Save fillable PDF',o:()=>'<label class=f>Field type<select id=ft><option value=tf>Text box</option><option value=cb>Checkbox</option><option value=dd>Dropdown</option></select></label><label class=f>Field name<input type=text id=fn value=field></label><label class=f>Dropdown options (comma-separated)<input type=text id=fo placeholder="Yes, No, Maybe"></label><p class=mut>Pick a type, then drag a rectangle on the page where the field should go.</p>',async run(fs){const w=W.formmake;if(!w.it.length)throw Error('Drag on the page to draw at least one field');const d=await load(fs[0]),form=d.getForm(),pg=d.getPages(),bc=PL.rgb(.3,.3,.3);for(const r of w.it){const p=pg[r.p-1],{width:pw,height:ph}=p.getSize(),bx={x:r.x*pw,y:ph-(r.y+r.h)*ph,width:r.w*pw,height:r.h*ph,borderWidth:1,borderColor:bc};if(r.ft==='cb'){const s=Math.min(bx.width,bx.height);form.createCheckBox(r.nm).addToPage(p,{...bx,width:s,height:s})}else if(r.ft==='dd'){const x=form.createDropdown(r.nm);x.addOptions(r.op.split(',').map(s=>s.trim()).filter(Boolean));x.addToPage(p,bx)}else form.createTextField(r.nm).addToPage(p,bx)}return[{name:'form.pdf',blob:await pdfb(d),note:w.it.length+' field(s) added. Open it in any PDF reader to fill.'}]}},
{id:'portfolio',n:'Create PDF Portfolio',d:'Bundle any files into one PDF (cover page + attachments)',i:'🗃️',c:'Organize',k:'any',multi:1,go:'Create portfolio',o:()=>'<label class=f>Portfolio title (Latin characters)<input type=text id=r1 value="Portfolio"></label>',async run(fs){const d=await PL.PDFDocument.create(),f=await d.embedFont(PL.StandardFonts.Helvetica),p=d.addPage([595,842]),cl=s=>s.replace(/[^\x20-\x7E]/g,'?');p.drawText(cl($('#r1').value||'Portfolio'),{x:50,y:780,size:22,font:f});let y=740;for(const x of fs){if(y<60){p.drawText('…',{x:50,y,size:11,font:f});break}p.drawText(cl(x.name+' ('+fmt(x.size)+')'),{x:50,y,size:11,font:f});y-=18}for(const x of fs)await d.attach(new Uint8Array(await x.arrayBuffer()),x.name,{mimeType:x.type||'application/octet-stream',creationDate:new Date(),modificationDate:new Date()});d.catalog.set(PL.PDFName.of('Collection'),d.context.obj({Type:'Collection',View:'D'}));return[{name:'portfolio.pdf',blob:await pdfb(d),note:fs.length+' file(s) embedded. Best viewed in Adobe Acrobat; other readers show them as attachments.'}]}},

function proc(p,maxW){const r=p.raw,rot=p.rot%360,sw=rot%180?r.height:r.width,sh=rot%180?r.width:r.height,k=Math.min(1,maxW/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);const x=c.getContext('2d',{willReadFrequently:true});x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);x.drawImage(r,-r.width*k/2,-r.height*k/2,r.width*k,r.height*k);
 const im=x.getImageData(0,0,c.width,c.height),a=im.data,f=p.f,C=Math.max(-200,Math.min(200,p.c*2.55+(f==='hc'?120:0))),cf=259*(C+255)/(255*(259-C)),bf=p.b*2.55;let lo=0,hi=255;
 if(f==='enh'||f==='bw'){const hs=new Uint32Array(256);for(let i=0;i<a.length;i+=4)hs[a[i]*.299+a[i+1]*.587+a[i+2]*.114|0]++;const n=a.length/4;let s=0;for(let i=0;i<256;i++){s+=hs[i];if(s<n*.02)lo=i;if(s<n*.97)hi=i}if(hi-lo<20){lo=0;hi=255}}
 for(let i=0;i<a.length;i+=4){let R=a[i],G=a[i+1],B=a[i+2];if(f!=='color'){let l=R*.299+G*.587+B*.114;if(f==='enh'||f==='bw')l=(l-lo)*255/(hi-lo);if(f==='bw')l=l>140?255:0;R=G=B=l}
  R=cf*(R-128)+128+bf;G=cf*(G-128)+128+bf;B=cf*(B-128)+128+bf;a[i]=R;a[i+1]=G;a[i+2]=B}
 x.putImageData(im,0,0);return c}
function addScan(src){const mw=2200,k=Math.min(1,mw/Math.max(src.width,src.height)),c=document.createElement('canvas');c.width=Math.round(src.width*k);c.height=Math.round(src.height*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);SC.pages.push({raw:c,rot:0,f:'enh',b:0,c:0});SC.sel=SC.pages.length-1;scanDraw()}
function stopCam(){if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}}
function scanView(){$('#m').innerHTML=`<button class="btn sm" data-v="home">← Dashboard</button><h2>📷 Scan Document</h2><p class=mut>Camera stays on your device. Edge detection and corner/perspective adjustment are not implemented yet: frame the page, then crop/rotate with the tools below.</p><div class=row style="justify-content:flex-start"><button class="btn pri" id=cam>Start camera</button><button class=btn id=snap hidden>📸 Capture</button><label class=btn>Take photo (system camera)<input type=file id=cp accept="image/*" capture=environment hidden></label><label class=btn>Import images<input type=file id=ip accept="image/jpeg,image/png,image/webp" multiple hidden></label></div><video id=vid playsinline muted hidden></video><div id=sc></div>`;
 $('#cam').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia)return toast('Camera API unavailable here. Use “Take photo” or Import.',1);try{SC.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:2560}},audio:false});const v=$('#vid');v.srcObject=SC.stream;v.hidden=false;await v.play();$('#snap').hidden=false}catch(e){toast(e.name==='NotAllowedError'?'Camera permission denied. Use “Take photo” or Import images instead.':'Camera unavailable: '+e.message,1)}};
 $('#snap').onclick=()=>{const v=$('#vid');if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);addScan(c)};
 const imp=async fl=>{for(const f of fl){const ty=await sniff(f);if(!['jpg','png','webp'].includes(ty)){toast(f.name+': unsupported image',1);continue}if(f.size>LIM*1048576){toast(f.name+' too large',1);continue}try{addScan(await createImageBitmap(f))}catch(e){toast(f.name+': cannot decode',1)}}};
 $('#cp').onchange=e=>{imp([...e.target.files]);e.target.value=''};$('#ip').onchange=e=>{imp([...e.target.files]);e.target.value=''};scanDraw()}
function scanDraw(){const el=$('#sc');if(!el)return;const P=SC.pages,s=P[SC.sel];if(!P.length){el.innerHTML='<p class=mut>No pages yet.</p>';return}
 el.innerHTML=`<h2>Pages (${P.length})</h2><div class=pg>${P.map((p,i)=>`<div class="card ${i==SC.sel?'sel':''}" data-s="${i}" tabindex=0><div data-th="${i}"></div><small>${i+1}</small></div>`).join('')}</div><div class=card style="margin-top:12px"><div class=row style="justify-content:flex-start"><button class="btn sm" data-sa="rot">⟳ Rotate</button><button class="btn sm" data-sa="up">◀ Earlier</button><button class="btn sm" data-sa="dn">Later ▶</button><button class="btn sm" data-sa="dup">⧉ Duplicate</button><button class="btn sm" data-sa="del">✕ Delete</button></div><label class=f>Filter<select id=sf>${[['color','Original color'],['gray','Grayscale'],['bw','Black & white'],['enh','Enhanced document'],['hc','High contrast']].map(o=>`<option value=${o[0]} ${s.f==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label><label class=f>Brightness<input type=range id=sb min=-50 max=50 value=${s.b}></label><label class=f>Contrast<input type=range id=sk min=-50 max=100 value=${s.c}></label><div id=pvw></div></div><div class=card style="margin-top:12px"><b>Create PDF</b><label class=f>Paper<select id=pp><option>A4</option><option>A3</option><option>Letter</option><option>Legal</option></select></label><label class=f>Orientation<select id=po><option value=auto>Auto</option><option value=port>Portrait</option><option value=land>Landscape</option></select></label><label class=f>Margin (mm)<input type=number id=pm value=8 min=0 max=40></label><label class=f>Image quality<select id=pq><option value=.9>High</option><option value=.75 selected>Medium</option><option value=.55>Small file</option></select></label><button class="btn pri" id=mk>Create PDF</button><div id=out></div></div>`;
 el.querySelectorAll('[data-th]').forEach(d=>{const c=proc(P[+d.dataset.th],200);d.append(c)});
 const draw=()=>{const c=proc(s,900);c.className='pv';c.style.width='100%';c.style.height='auto';const v=$('#pvw');v.replaceChildren(c)};draw();
 $('#sf').onchange=e=>{s.f=e.target.value;scanDraw()};['sb','sk'].forEach(id=>$('#'+id).onchange=e=>{s[id==='sb'?'b':'c']=+e.target.value;scanDraw()});
 $('#mk').onclick=async()=>{cancel=false;$('#mk').disabled=true;$('#out').innerHTML='<small class=mut>Building PDF…</small>';try{const its=[];for(const p of P){its.push({blob:await blobc(proc(p,2200),'image/jpeg',+$('#pq').value),type:'jpg'})}const b=await imgToPdf(its,{size:$('#pp').value,orient:$('#po').value,m:+$('#pm').value});showRes([{name:'scan.pdf',blob:b}])}catch(e){$('#out').innerHTML=`<div class="card err">⚠ ${esc(errm(e))}</div>`}$('#mk').disabled=false}}
/* ---------- events ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('button,[data-i],.logo,[data-t],[data-s]');if(!t)return;const D=t.dataset;
 if(D.v)view(D.v);else if(D.t)view('tool',D.t);else if(D.i)modal(`<h3>${D.i}</h3><p>${INFO[D.i]}</p>`);
 else if(D.dl)save(H[+D.dl].name,H[+D.dl].blob);else if(D.rd)save(W.res[+D.rd].name,W.res[+D.rd].blob);
 else if(D.rm!=null){W[cur.id].files.splice(+D.rm,1);drawList(cur)}
 else if(D.mv){const[i,d]=D.mv.split(',').map(Number),f=W[cur.id].files,j=i+d;if(j>=0&&j<f.length){[f[i],f[j]]=[f[j],f[i]];drawList(cur)}}
 else if(D.o){const[a,j]=D.o.split(','),pg=W.organize.pg,n=+j;if(a==='l'&&n>0)[pg[n],pg[n-1]]=[pg[n-1],pg[n]];if(a==='r'&&n<pg.length-1)[pg[n],pg[n+1]]=[pg[n+1],pg[n]];if(a==='t')pg[n].r=(pg[n].r+90)%360;if(a==='d')pg.splice(n+1,0,{...pg[n]});if(a==='x'){if(pg.length==1)toast('Keep at least one page',1);else pg.splice(n,1)}orgDraw(cur)}
 else if(D.s!=null&&!e.target.closest('button')){SC.sel=+D.s;scanDraw()}
 else if(D.sa){const P=SC.pages,i=SC.sel,a=D.sa;if(a==='rot')P[i].rot=(P[i].rot+90)%360;if(a==='up'&&i>0){[P[i],P[i-1]]=[P[i-1],P[i]];SC.sel--}if(a==='dn'&&i<P.length-1){[P[i],P[i+1]]=[P[i+1],P[i]];SC.sel++}if(a==='dup'){P.splice(i+1,0,{...P[i]});SC.sel++}if(a==='del'){if(await modal('<p>Delete this page?</p>',['Cancel','Delete'])!==1)return;P.splice(i,1);SC.sel=Math.min(i,P.length-1)}scanDraw()}
 else if(t.id==='selpdf')$('#pick').click();else if(t.classList.contains('logo'))view('home')});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.id==='logo'){e.preventDefault();view('home')}if((e.key==='Enter')&&e.target.dataset?.s!=null){SC.sel=+e.target.dataset.s;scanDraw()}});
document.addEventListener('change',async e=>{if(e.target.id==='pick'){const f=[...e.target.files];view('tool','organize');await add(cur,f)}
 if(e.target.id==='lim'){LIM=Math.max(1,+e.target.value||100);try{localStorage.setItem('sp-lim',LIM)}catch(x){}}
 if(e.target.id==='thm'){document.documentElement.dataset.theme=e.target.value;try{localStorage.setItem('sp-theme',e.target.value)}catch(x){}}});
document.addEventListener('input',e=>{if(e.target.id==='q'){$('#dir').innerHTML=dir(e.target.value)}});
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-j]');if(c)e.dataTransfer.setData('text/plain',c.dataset.j)});
document.addEventListener('dragover',e=>{if(e.target.closest?.('[data-j]'))e.preventDefault()});
document.addEventListener('drop',e=>{const c=e.target.closest?.('[data-j]');if(!c||!W.organize)return;e.preventDefault();const a=+e.dataTransfer.getData('text/plain'),b=+c.dataset.j,pg=W.organize.pg;if(a!==b&&!isNaN(a)){pg.splice(b,0,pg.splice(a,1)[0]);orgDraw(cur)}});
$('#theme').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark';try{localStorage.setItem('sp-theme',d.dataset.theme)}catch(x){}};
if(!PL||!PJ)toast('A required library failed to load. Check your connection and reload.',1);
view('home');
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
